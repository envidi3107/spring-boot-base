spring:
  application:
    name: hrms
  # Cho phép khai báo biến môi trường trong file .env ở thư mục gốc (dùng chung với compose.yaml)
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${DB_USERNAME:hrms}
    password: ${DB_PASSWORD:hrms}
    hikari:
      pool-name: hrms-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp với bảng, sai lệch thì không khởi động.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    locations: classpath:db/migration
    # Không cho chạy migration lệch thứ tự hay sửa script đã chạy (checksum sai → dừng khởi động)
    validate-on-migrate: true
    out-of-order: false
    # Chặn flyway clean (xoá sạch schema); chỉ bật tạm thời khi thật sự cần ở dev
    clean-disabled: true
    # Bật khi gắn Flyway vào DB đã có sẵn bảng (vd. do ddl-auto=update tạo trước đây)
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # Bổ sung path public riêng của dự án (ngoài auth, health, swagger...), vd: /api/v1/public/**
    public-paths: []
    jwt:
      # Bắt buộc, tối thiểu 64 ký tự. Sinh bằng: openssl rand -base64 64
      secret: ${JWT_SECRET:}
      issuer: ${spring.application.name}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    bootstrap-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
