# Hạ tầng cho môi trường dev: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: hrms-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hrms}
      POSTGRES_USER: ${DB_USERNAME:-hrms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hrms}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
